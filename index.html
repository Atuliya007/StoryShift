<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StoryShift</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <h2>StoryShift</h2>

            <div>
                <a href="#">Home</a>
                <a href="#stories">Explore Stories</a>
            </div>
        </nav>
    </header>

    <main>
        <section class="hero">
            <p class="tagline">YOUR CHOICES. YOUR STORY.</p>

            <h1>Every choice changes everything.</h1>

            <p class="description">
                Step into interactive stories where your decisions
                shape the journey and every ending is different.
            </p>

            <button id="exploreBtn">Explore Stories →</button>
        </section>

        <section id="stories">
            <h2>Choose Your Adventure</h2>
            <p>Your next story is waiting for you.</p>
        </section>
    </main>
</body>

</html>
